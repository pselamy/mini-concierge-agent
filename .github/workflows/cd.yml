name: CD

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write # Required for WIF

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
        service_account: ${{ secrets.GCP_WIF_SA }}
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker Client
      run: |
        gcloud auth configure-docker ${{ secrets.GCP_REGION || 'us-central1' }}-docker.pkg.dev --quiet

    - name: Build and Push Container Image
      run: |
        IMAGE_NAME="${{ secrets.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_REPOSITORY || 'mini-concierge' }}/agent:${{ github.sha }}"
        docker build -t $IMAGE_NAME .
        docker push $IMAGE_NAME

    - name: Set up OpenTofu
      uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: 1.8.1

    - name: OpenTofu Init
      run: tofu init -backend-config="bucket=${{ secrets.GCP_TF_STATE_BUCKET }}"
      working-directory: ./terraform

    - name: OpenTofu Apply
      run: |
        tofu apply -auto-approve \
          -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
          -var="region=${{ secrets.GCP_REGION || 'us-central1' }}" \
          -var="image_tag=${{ github.sha }}" \
          -var="gemini_api_key=${{ secrets.GEMINI_API_KEY }}"
      working-directory: ./terraform

